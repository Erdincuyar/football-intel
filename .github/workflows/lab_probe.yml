# GECICI (Faz 11 arastirma): FotMob ham ornekleri lab/fotmob-data dalina yazar. Birlestirilmez.
name: lab-probe
on:
  push:
    branches: ["lab/probe-sources"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python probe/probe.py
      - name: Ornekleri ayri dala yaz
        run: |
          cd out
          git init -q -b lab/fotmob-data
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "FotMob ham ornekler"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lab/fotmob-data
