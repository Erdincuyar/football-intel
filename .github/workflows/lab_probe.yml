# GECICI (Faz 11 arastirma): ucretsiz veri kaynaklarina CI'dan erisimi dener. Birlestirilmez.
name: lab-probe
on:
  push:
    branches: ["lab/probe-sources"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python probe/probe.py
