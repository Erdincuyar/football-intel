# GECICI (Faz 11 arastirma): API-Football ucretsiz plan erisimini dener. Birlestirilmez.
name: lab-probe
on:
  push:
    branches: ["lab/probe-sources"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python probe/probe.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
