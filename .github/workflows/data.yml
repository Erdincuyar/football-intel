# Veri hatti: football-data.co.uk'tan indir, temizle, DuckDB'ye yukle.
#
# Neden GitHub Actions? football-data.co.uk Turkiye'den erisime kapali. Actions
# sunuculari yurt disinda calistigi icin siteye erisebilir. Ayrica Faz 4'teki
# haftalik otomatik guncellemenin temelini simdiden kurmus oluyoruz.
#
# Ciktilar "artifact" olarak saklanir (90 gun). Indirmek icin:
#   gh run download --repo Erdincuyar/football-intel --name footintel-data --dir data
name: data

on:
  schedule:
    # Gunde uc kez: 06:00, 12:00 ve 17:00 UTC. football-data.co.uk fikstur listesini hafta
    # icinde parca parca gunceller; Cuma sabahi bile listede yalnizca hafta ici alt lig
    # maclari olabiliyor. GitHub zamanlanmis isleri saatlerce geciktirebildigi icin de tek
    # calisma yetmiyor. Defter ayni maci ikinci kez tahmin etmez, baslamis maci atlar.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}      # Actions sekmesinden elle calistirma
  pull_request:
    paths:
      - "src/**"
      - "pipelines/**"
      - "sql/**"
      - "tests/**"
      - "notebooks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/data.yml"

permissions:
  contents: write   # tahmin defteri dosyalarini commit'lemek icin (yalnizca PR disi calistirmalar)

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Faz 8: veri katmaninin Postgres testleri icin gecici bir veritabani (yalnizca test).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: uv kur
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Bagimliliklari kur
        run: uv sync --locked --group eda --group app

      - name: Lint
        run: uv run ruff check .

      - name: Streamlit Cloud gereksinimleri guncel mi?
        # app/requirements.txt uv.lock'tan uretilir; elle duzenlenmez.
        run: >
          uv export -q --no-hashes --no-dev --group app --no-emit-project
          --format requirements-txt | diff - app/requirements.txt

      - name: Testler
        env:
          FOOTINTEL_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: uv run pytest -q

      - name: Veri hattini calistir (football-data.co.uk)
        run: uv run python pipelines/build_football_data.py

      - name: Understat ve ClubElo
        run: uv run python pipelines/build_sources.py

      - name: Kendi Elo modelimiz
        run: uv run python pipelines/build_elo.py

      - name: "Faz 3: gol ve korner modelleri (walk-forward backtest)"
        run: uv run python pipelines/build_models.py

      - name: "Faz 5: korner regresyonu (ozellik secimi, test, kapi)"
        run: uv run python pipelines/build_corners.py

      - name: "Faz 10: 1X2 sonuc modeli (DC + piyasa reytingi, walk-forward kapi)"
        run: uv run python pipelines/build_outcome.py

      - name: "Faz 9: kart verisi kapsami ve kart modeli"
        run: uv run python pipelines/build_cards.py

      - name: "Faz 9: ilk yari sonucu modeli"
        run: uv run python pipelines/build_halftime.py

      - name: "Faz 9: gecmis maclar icin surumlu tahmin tablosu"
        env:
          FOOTINTEL_DATABASE_URL: ${{ github.event_name != 'pull_request' && secrets.FOOTINTEL_DATABASE_URL || '' }}
        run: uv run python pipelines/build_history.py

      - name: "Faz 4: yaklasan maclari tahmin et ve deftere yaz"
        # PR'larda deftere yazilmaz (--dry-run): defter yalnizca main'de buyur.
        run: >
          uv run python pipelines/predict_upcoming.py
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

      - name: "On tahmin: her ligin bir sonraki haftasi (openfootball + fixturedownload)"
        run: uv run python pipelines/build_preview.py

      # Faz 11: FotMob (resmi olmayan kaynak). Biten maclar onbellekte tutulur, her
      # calismada yalnizca yeni maclar ve yaklasan maclarin sakat/cezali listesi indirilir.
      # Kaynak cevap vermezse hat durmaz; yazilar FotMob bilgisi olmadan uretilir.
      - name: FotMob onbellegi
        uses: actions/cache@v4
        with:
          path: data/raw/fotmob
          key: fotmob-${{ github.run_id }}
          restore-keys: fotmob-

      - name: "Faz 11: FotMob (xG, kadro, sakat/cezali)"
        continue-on-error: true
        run: uv run python pipelines/ingest_fotmob.py --budget 800

      - name: "Faz 11: tahmin yazilari ve haftanin kuponu"
        run: uv run python pipelines/build_insights.py

      - name: Tahmin defterini degerlendir
        run: uv run python pipelines/evaluate_ledger.py

      - name: Tahmin defterini commit'le
        # Commit zamani, tahminin mac oncesi yapildiginin herkese acik kanitidir.
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions/
          if git diff --cached --quiet; then echo "Yeni tahmin yok"; exit 0; fi
          git commit -m "Tahmin defteri: $(date -u '+%F %H:%M') UTC"
          # Calisma sirasinda main ilerlemis olabilir (or. bir PR merge edildi).
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: StatsBomb onbellegi
        # 2015/16 olay verisi degismez; her calismada ~4.6 GB yeniden indirmemek icin
        # ince Parquet ciktisini onbellekte tutuyoruz (anahtari degistirmek yeniden indirir).
        uses: actions/cache@v4
        with:
          path: data/raw/statsbomb
          key: statsbomb-1516-v1

      - name: "Faz 6: taktik metrikler ve stil profili"
        run: uv run python pipelines/build_tactics.py

      - name: "Faz 7: stil gruplari ve eslesme kurallarinin testi"
        run: uv run python pipelines/build_matchup.py

      - name: "Faz 8: uygulama verisini Neon'a yayinla"
        # Secret tanimli degilse betik kendisi atlar. PR'larda calismaz: canli veritabanina
        # yalnizca main yazar.
        if: github.event_name != 'pull_request'
        env:
          FOOTINTEL_DATABASE_URL: ${{ secrets.FOOTINTEL_DATABASE_URL }}
        run: uv run python pipelines/publish_app_data.py

      - name: EDA ozeti
        run: uv run python pipelines/eda_report.py

      - name: EDA notebook'unu calistir (HTML rapor)
        run: >
          uv run jupyter nbconvert --to html --execute notebooks/01_eda.ipynb
          --output-dir reports/

      - name: EDA raporunu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: eda-report
          path: reports/
          retention-days: 90
          if-no-files-found: error

      - name: Veriyi artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: footintel-data
          path: |
            data/clean/
            data/footintel.duckdb
          retention-days: 90
          if-no-files-found: error
