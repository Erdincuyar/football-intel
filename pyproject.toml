[project]
name = "footintel"
version = "0.1.0"
description = "Football tactical and betting intelligence platform (portfolio project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "requests>=2.32",
    "truststore>=0.10",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
eda = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
